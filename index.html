<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle Generator — SVG → 3D-printable jigsaw puzzle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🧩</text></svg>">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<aside id="panel">
  <h1>Puzzle Generator</h1>
  <p class="sub">SVG in → 3D-printable jigsaw puzzle + tray out</p>

  <div class="row file-row">
    <label class="file-btn">Load SVG<input id="file" type="file" accept=".svg,image/svg+xml"></label>
    <button id="sample" type="button">Try sample dog</button>
  </div>
  <div id="fileLabel" class="filelabel">no file loaded — you can also drag &amp; drop</div>

  <h2>Puzzle</h2>
  <div class="grid">
    <label>Width (mm)<input id="targetWidth" type="number" value="180" min="30" max="400" step="5"></label>
    <label>Pieces (approx.)<input id="targetPieces" type="number" value="30" min="2" max="200" step="1"></label>
    <label>Piece height (mm)<input id="pieceHeight" type="number" value="6" min="1" max="30" step="0.5"></label>
    <label>Gap between pieces (mm)<input id="gap" type="number" value="0.35" min="0" max="2" step="0.05"></label>
    <label>Seed<input id="seed" type="number" value="7" min="0" step="1"></label>
    <label class="btnlabel">&nbsp;<button id="randomize" type="button">🎲 Randomize</button></label>
  </div>

  <h2>Tray</h2>
  <div class="grid">
    <label>Base height (mm)<input id="baseHeight" type="number" value="2.4" min="0.6" max="20" step="0.2"></label>
    <label>Border height (mm)<input id="borderHeight" type="number" value="8" min="1" max="40" step="0.5"></label>
    <label>Border width (mm)<input id="borderWidth" type="number" value="5" min="1" max="25" step="0.5"></label>
    <label>Pocket clearance (mm)<input id="trayClearance" type="number" value="0.25" min="0" max="2" step="0.05"></label>
  </div>

  <h2>Surface art</h2>
  <div class="grid">
    <label>Mode
      <select id="surfaceMode">
        <option value="engrave" selected>Engrave lines</option>
        <option value="emboss">Emboss lines</option>
        <option value="none">Plain top</option>
      </select>
    </label>
    <label>Line width (mm)<input id="lineWidth" type="number" value="1.2" min="0.3" max="5" step="0.1"></label>
    <label>Line depth (mm)<input id="lineDepth" type="number" value="1.0" min="0.2" max="5" step="0.1"></label>
  </div>

  <h2>Preview</h2>
  <label class="slider">Explode
    <input id="explode" type="range" min="0" max="1" step="0.01" value="0">
  </label>

  <div id="status" class="status"></div>
  <div id="warnings" class="warnings"></div>

  <h2>Export STL</h2>
  <div class="exports">
    <button id="exportPieces" disabled>Pieces</button>
    <button id="exportTray" disabled>Tray</button>
    <button id="exportAll" disabled>Both (side by side)</button>
  </div>

  <p class="foot">Everything runs locally in your browser. Millimetre units, Z-up STL.</p>
</aside>
<main id="stage">
  <canvas id="view"></canvas>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
